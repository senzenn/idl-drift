# Check each IDL against live mainnet data every night with idl-verify.
# Copy to .github/workflows/ in your repository. Setup and results: docs/ci.md in idl-drift.
name: idl-verify nightly

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # idl-verify stops a decoder that gives no reply for 60 s; this limit stops a slow RPC.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Lower this if your RPC plan rate-limits parallel runs.
      max-parallel: 4
      matrix:
        include:
          - name: my_program
            idl: idls/my_program.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Optional: build your decoder under test, and give it in `args` below.
      # - run: cargo build --release --bin verify-decoder

      # For stable results, pin a full commit SHA here and set `version` to its tag.
      - uses: senzenn/idl-drift@v0.2.0
        id: verify
        with:
          command: verify
          idl: ${{ matrix.idl }}
          # The action gives the URL to idl-verify only in IDL_VERIFY_RPC_URL.
          rpc-url: ${{ secrets.IDL_VERIFY_RPC_URL }}
          # args: --decoder target/release/verify-decoder --min-coverage 50

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.verify.outputs.report != ''
        with:
          name: idl-verify-${{ matrix.name }}
          path: |
            ${{ steps.verify.outputs.report }}
            ${{ steps.verify.outputs.samples }}
          if-no-files-found: ignore
