[package]
name = "shipstern-guard"
version = "0.0.0"
edition = "2021"
publish = false
description = "A Shipstern parser wrapped in an idl-drift-guard Guard"
license = "MIT OR Apache-2.0"

# Not part of the idl-drift workspace: the parser crates stay out of its build and MSRV.
[workspace]

[dependencies]
shipstern-core = "=0.12.0"
shipstern-parser = "=0.12.0"
shipstern-proc-macro = "=0.12.0"
borsh = { version = "1", features = ["derive"] }
idl-drift-guard = { path = "../../../crates/idl-drift-guard" }

[dev-dependencies]
base64 = "0.22"
bs58 = "0.5"
serde_json = "1"

[features]
# The generated types derive serde only with this feature. Declaring it keeps the
# `unexpected_cfgs` warning away.
serde = []
