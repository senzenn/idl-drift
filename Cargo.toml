[workspace]
members = [
    "crates/idl-drift",
    "crates/idl-verify",
    "crates/idl-verify-shipstern",
    "crates/idl-verify-carbon",
    "crates/idl-drift-guard",
    "crates/idl-verify-fixtures",
]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/senzenn/idl-drift"

[workspace.dependencies]
# No `rpc` by default: the guard crate must not pull in an HTTP client. idl-verify asks for it.
idl-drift = { path = "crates/idl-drift", version = "0.3.1", default-features = false }
base64 = "0.22"
bs58 = "0.5"
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
