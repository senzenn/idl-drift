[package]
name = "shipstern-decoder"
version = "0.0.0"
edition = "2021"
publish = false
description = "A Shipstern parser as the decoder under test for idl-verify --decoder"
license = "MIT OR Apache-2.0"

# Not part of the idl-drift workspace: the parser crates stay out of its build and MSRV.
[workspace]

[dependencies]
shipstern-core = "=0.12.0"
shipstern-parser = "=0.12.0"
# `program-events` makes the parser decode events, so that idl-verify compares them too.
shipstern-proc-macro = { version = "=0.12.0", features = ["program-events"] }
borsh = { version = "1", features = ["derive"] }
idl-verify-shipstern = { path = "../../../crates/idl-verify-shipstern" }

[features]
# The generated types derive serde only with this feature. The adapter reads `Debug`, so it
# stays off; declaring it keeps the `unexpected_cfgs` warning away.
serde = []
