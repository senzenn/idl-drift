[package]
name = "idl-verify"
description = "Check a Solana program IDL against real account, instruction and event data."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["solana", "idl", "anchor", "borsh", "zero-copy"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**/*.rs", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
idl-drift.workspace = true
base64.workspace = true
bs58.workspace = true
clap = { workspace = true, features = ["env"] }
owo-colors.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror = "2"
ureq = { version = "3.4", features = ["json"] }

[[bin]]
name = "idl-verify"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11"
