[package]
name = "idl-verify-fixtures"
description = "One #[test] per fixture file of idl-verify --export-fixtures, for a Shipstern parser or a Carbon decoder."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["solana", "idl", "shipstern", "carbon", "testing"]
categories = ["development-tools::testing", "development-tools::procedural-macro-helpers"]
include = ["/src/**/*.rs", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[lib]
proc-macro = true

# No Shipstern, Carbon or Solana dependency: the generated tests name the user's own crates, so
# their versions never clash with a copy that this crate adds.
[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[lints]
workspace = true
