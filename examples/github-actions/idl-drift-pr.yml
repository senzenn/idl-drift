# Diff each IDL with its version on the base branch, on each pull request, with idl-drift.
# Copy to .github/workflows/ in your repository. Setup and results: docs/ci.md in idl-drift.
name: idl-drift

on:
  pull_request:
    paths:
      - "**/idls/**"

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        idl:
          - idls/my_program.json
    steps:
      # The action fetches the base branch with these credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # For stable results, pin a full commit SHA here and set `version` to its tag.
      - uses: senzenn/idl-drift@v0.3.0
        id: drift
        with:
          idl: ${{ matrix.idl }}
          # Lowest tier that fails the job: breaking, dangerous, additive or cosmetic.
          fail-on: breaking
          # Changes that you accept, one `<kind> <subject>` per line.
          # allow: idls/allow.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.drift.outputs.report != ''
        with:
          name: idl-drift-report-${{ strategy.job-index }}
          path: ${{ steps.drift.outputs.report }}
