# Diff each IDL that a pull request changes against the base branch with idl-drift.
# Copy to .github/workflows/ in your repository. Setup and results: docs/ci.md in idl-drift.
name: idl-drift

on:
  pull_request:
    paths:
      - "**/idls/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Lowest change tier that fails the job: breaking, dangerous, additive or cosmetic.
  FAIL_ON: breaking
  # idl-drift commit to build. Empty: the default branch. Pin a SHA for stable results.
  IDL_DRIFT_REV: ""

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch -q --no-tags --depth 1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install idl-drift
        run: |
          cargo install --locked --git https://github.com/senzenn/idl-drift \
            ${IDL_DRIFT_REV:+--rev "$IDL_DRIFT_REV"} idl-drift

      - name: Diff changed IDLs
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p "$RUNNER_TEMP/base" reports
          # Not a process substitution: a failed git diff must fail the step, not skip each IDL.
          changes=$(git diff --name-status -M "origin/$BASE_REF" HEAD -- ':(glob)**/idls/**/*.json')
          failed=0
          while IFS=$'\t' read -r status old new; do
            case $status in
              "")
                continue
                ;;
              A)
                echo "::notice file=$old::New IDL, no base version to diff."
                continue
                ;;
              D)
                echo "::warning file=$old::IDL removed, nothing to diff."
                continue
                ;;
            esac
            new=${new:-$old}
            base="$RUNNER_TEMP/base/${old//\//-}"
            git show "origin/$BASE_REF:$old" > "$base"
            echo "== $old -> $new"
            code=0
            idl-drift diff "$base" "$new" --fail-on "$FAIL_ON" || code=$?
            idl-drift diff "$base" "$new" --fail-on "$FAIL_ON" --json > "reports/${new//\//-}" || true
            case $code in
              0)
                ;;
              1)
                echo "::error file=$new,title=IDL drift::This change has at least one $FAIL_ON change or worse. Each change is listed above and in the artifact."
                failed=1
                ;;
              *)
                echo "::error file=$new,title=idl-drift could not run::Exit code $code, so nothing was compared. The cause is printed above, such as a file that is not an Anchor or Codama IDL."
                failed=1
                ;;
            esac
          done <<< "$changes"
          exit "$failed"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: idl-drift-reports
          path: reports/
          if-no-files-found: ignore
